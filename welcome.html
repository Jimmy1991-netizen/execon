<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Background Division</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    background: #f0f0f0;
    font-family: Arial, sans-serif;
    padding: 40px;
  }

  .video-box {
    position: relative;
    width: 350px;
    height: 650px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }

  .video-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
  }

  .overlay-text {
    color: white;
    font-size: 20px;
    font-weight: bold;
    text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    opacity: 0;
    transition: opacity 1s ease;
  }

  .show-text {
    opacity: 1;
  }

  .audio-btn {
    position: absolute;
    top: 300px;
    left: 120px;
    padding: 10px;
    font-size: 14px;
    /*background: rgba(0,0,0,0.6);*/
	background:lightgray;
    color: black;
    border-radius: 10px;
    cursor: pointer;
    pointer-events: auto;
  }
</style>
</head>

<body>
<center>
<div class="video-box">
  <video id="bgVideo" autoplay muted loop>
    <source src="execon12.mp4" type="video/mp4">
  </video>

  <div class="overlay">

    <div id="overlayText" class="overlay-text" style="font-size:20px;position:absolute;top:250px;left:20px;"">
      <p><i>Welcome to Loboc...</i></p>
    </div>

<br>
    <div id="overlayText2" class="overlay-text" style="font-size:20px;position:absolute;top:250px;left:20px;">
      <p><i>where leadership meets nature, culture, and community.</i></p> 
    </div>
<br>

    <div id="overlayText3" class="overlay-text" style="font-size:20px;position:absolute;top:250px;left:20px;">
      <p><i>Today, you are invited to a one-day journey through a piece of heaven.</i></p>
    </div>



  </div>






  <button class="audio-btn" onclick="toggleAudio(this)">🔊 Play Music</button>
</div>
</center>

<script>


  const video = document.getElementById("bgVideo");

//text
  const text = document.getElementById("overlayText");
  setTimeout(() => {
    text.classList.add("show-text");
  }, 2000);

  setTimeout(() => {
    text.classList.remove("show-text");
  }, 5000);

//text2
  const text2 = document.getElementById("overlayText2");
  setTimeout(() => {
    text2.classList.add("show-text");
  }, 7000);

  setTimeout(() => {
    text2.classList.remove("show-text");
  }, 10000);


//text3
  const text3 = document.getElementById("overlayText3");
  setTimeout(() => {
    text3.classList.add("show-text");
  }, 13000);

  setTimeout(() => {
    text3.classList.remove("show-text");
  }, 25000);




  function toggleAudio(btn) {
    video.muted = false;
    btn.style.display = "none";
  }

  // 🔁 Redirect after 30 seconds
  setTimeout(() => {
    window.location.href = "icons.html";
  }, 30000);
</script>

</body>
</html>
