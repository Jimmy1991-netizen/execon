<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A One-Day Journey to Loboc</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #ff6600;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #fff;
      border-bottom: 2px solid #ddd;
    }

    nav button {
      background: none;
      border: none;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
      color: #333;
    }

    nav button.active {
      border-bottom: 3px solid #ff6600;
      color: #ff6600;
      font-weight: bold;
    }

    /* MAIN CONTAINER */
    .container {
      flex: 1;
      display: none;
      padding: 20px;
    }

    /* CENTER PRODUCTS */
    .container.active {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* PRODUCT GRID */
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 220px));
      gap: 20px;
      justify-content: center;
    }

    .product {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 10px;
      text-align: center;
      transition: 0.3s;
    }



    .product img {
      width: 100%;
      border-radius: 10px;
    }

    .product p {
      font-size: 14px;
      margin: 8px 0;
    }

    .product button {
      background-color: #ff6600;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }

    .product button:hover {
      background-color: #e65c00;
    }

    /* SHARE POPUP */
    .share-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      padding: 20px;
      text-align: center;
      z-index: 1000;
      width: 300px;
    }

    .share-popup img {
      width: 80px;
      height: 80px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 900;
    }

/* Popup Overlay */
.popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
}

.popup img {
    max-width: 350px;
    max-height: 650px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.5);
}



  </style>
</head>

<body>

<!-- Popup stops-->
<div class="popup" id="popup">
    <img src="bilar.gif" alt="Popup Image">
</div>

<!-- Popup stops-->
<div class="popup" id="popup2">
    <img src="sikatuna.gif" alt="Popup Image">
</div>

<!-- Popup stops-->
<div class="popup" id="popup3">
    <img src="loay.gif" alt="Popup Image">
</div>

<!-- Audio -->
<audio id="music" src="loboc.m4a"></audio>


<header>A One-Day Journey to Loboc</header>

<nav>
  <button class="tab active" data-tab="home">👉 Start the Journey</button>
</nav>

<!-- HOME -->
<section class="container active" id="home">
  <div class="products">
<p>Choose your point of entry.</p>
    <div class="product" style="background:green;color:white;">
      <h3>Via Bilar</h3>
        <img src="image1.jpg">
      <button onclick="showPopup()">Proceed</button>
    </div>

    <div class="product" style="background:red;color:white;">
      <h3>Via Sikatuna</h3>
        <img src="image2.jpg"> 
      <button onclick="showPopup2()">Proceed</button>
    </div>

    <div class="product" style="background:blue;color:white;">
      <h3>Via Loay</h3>
        <img src="image3.jpg">
      <button onclick="showPopup3()">Proceed</button>
    </div>

    <div class="product" style="background:cornsilk;"> 
      <p><i>Created by:<br>
<b style="left:20px;">Jimmy Odal Egcalinos</b>
<i style="left:20px;">LNHS Teacher</i></p><br>
    </div>

    
    <div class="product"> 
      <a href="index.html"><button>Back to Welcome Page</button></a>
    </div>

  </div>
</section>

<!-- SHARE POPUP -->
<div class="overlay" id="overlay" onclick="closeShare()"></div>

<div class="share-popup" id="sharePopup">
  <img id="shareImage">
  <p id="shareLink"></p>
  <button onclick="copyLink()">Copy Link</button>
  <button onclick="closeShare()">Close</button>
</div>

<script>
  const popup = document.getElementById('sharePopup');
  const overlay = document.getElementById('overlay');
  const shareImg = document.getElementById('shareImage');
  const shareLink = document.getElementById('shareLink');

  function shareProduct(img, link) {
    shareImg.src = img;
    shareLink.textContent = link;
    popup.style.display = 'block';
    overlay.style.display = 'block';
  }

  function closeShare() {
    popup.style.display = 'none';
    overlay.style.display = 'none';
  }

  function copyLink() {
    navigator.clipboard.writeText(shareLink.textContent);
    alert('Product link copied!');
  }


//pop up open via bilar 
function showPopup() {
    const popup = document.getElementById("popup");
    const music = document.getElementById("music");

    popup.style.display = "flex";
    music.currentTime = 0;
    music.play();

    setTimeout(() => {
        popup.style.display = "none";
        music.pause();

        // Redirect to next page
        window.location.href = "iconsbilar.html";
    }, 7000); // 10 seconds
}
//pop up close via bilar 

//pop up open via sikatuna

</body>
</html>
