<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Splash Screen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        background: skyblue;
        overflow: hidden;
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    .video-box {
        width: 350px;
        height: 650px;
        position: relative;
        overflow: hidden;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        margin: 0 auto;
    }

    .video-box video {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /*/ Overlay container */
    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.35); /* dark overlay for readability */
        display: flex;
            /*justify-content: center;    */
            /*align-items: center;    */
            text-align: left;    
        color: #fff;
        z-index: 2;
        padding: 20px;
    }

    .overlay h1 {
        font-size: 28px;
        margin: 0;
    }

    .overlay p {
        margin-top: 10px;
        font-size: 16px;
        opacity: 0.9;
    }

   .loader-container {
        width: 320px;
        text-align: center;
    }

    .progress-text {
        font-size: 18px;
        margin-bottom: 12px;
    }

    .progress-bar {
        width: 100%;
        height: 18px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ffcc, #00ccff);
        border-radius: 10px;
        transition: width 0.1s linear;
    }

</style>
</head>

<body>

<audio id="audio">
    <source src="loboc.m4a" type="audio/mp4">
    Your browser does not support the audio element.
</audio>


<div class="video-box">
    <video autoplay muted loop playsinline>
        <source src="execon1.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
<center>
    <!-- Overlay Text -->
    <div class="overlay">
        <div>
            <span style="position:absolute;top:5%;left:20%;color:white;font-size:100%;">SCHOOLS DIVISION OF BOHOL</span>
            <h1 style="text-shadow:0 0 0px darkblue;font-size:250%;color:white;position:absolute;top:12%;">EXECUTIVE CONFERENCE</h1>
         <span><img src="bohol.png" width="100%" height="8%"></span>

   
<br>
         <span style="position:absolute;top:26%;left:3%;font-size:100%;"><i>“A Piece of Heaven: A Journey of Leadership,</i></span>
         <span style="position:absolute;top:29%;left:22%;font-size:100%;"><i>Culture, and Connection”</i></span>


<h3 style="position:absolute;top:30%;left:27%;font-size:100%;">January 15, 2026</h3>
         <span style="position:absolute;top:35%;left:27%;font-family:'Segoe Script', cursive;color:white;font-size:100%;">LOBOC District</span>



<h3 style="position:absolute;top:90%;left:20%;font-family:'Brush Script MT', cursive;font-size:150%;">You are cordially invited</h3>
        </div>

<div class="loader-container" style="position:absolute;top:65%;left:5%;" >
    <div class="progress-text" id="progressText">0%</div>
    <div class="progress-bar" style="width:95%;">
        <div class="progress-fill" id="progressFill"></div>
<div style="position:absolute;top:135%;left:5%;"><center><button id="playBtn" style="border-radius:10px;background:lightgray;padding:10%;width:150%;font-size:100%;">▶ Play Music</button></div>
    </div>
</div>








    </div>
</center>

</div>

<script>
    setTimeout(function () {
        window.location.href = "icons.html";
    }, 35000); // 30 seconds


const duration = 30000; // 15 seconds
    const interval = 100;  // update every 100ms
    const steps = duration / interval;
    let progress = 0;

    const progressFill = document.getElementById("progressFill");
    const progressText = document.getElementById("progressText");

    const timer = setInterval(() => {
        progress++;
        const percent = Math.min(Math.round((progress / steps) * 100), 100);

        progressFill.style.width = percent + "%";
        progressText.textContent = percent + "%";

        if (percent >= 100) {
            clearInterval(timer);
            progressText.textContent = "Completed";
        }
    }, interval);


//audio open

const playBtn = document.getElementById("playBtn");
    const audio = document.getElementById("audio");
    let stopTimer;

    playBtn.addEventListener("click", () => {
        audio.currentTime = 0;
        audio.play();

        clearTimeout(stopTimer);

        // Stop audio after 30 seconds (30000 ms)
        stopTimer = setTimeout(() => {
            audio.pause();
            audio.currentTime = 0;
        }, 35000);
    });

//audio close

</script>

</body>
</html>
